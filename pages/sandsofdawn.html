<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="page-title">Project - Portfolio - Andrea Bona</title>
    <meta name="description" id="page-desc" content="">
    <link rel="icon" href="../images/webicon2.png" type="image/x-icon">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        
        :root {
            --bg:#1f242d; --bg2:#323946; --bg3:#252c38;
            --text:#fff; --muted:rgba(255,255,255,0.6);
            --accent:#0ef; --accent-dim:rgba(0,238,255,0.15);
            --accent-border:rgba(0,238,255,0.35);
        }
        
        html { font-size:62.5%; scroll-behavior:smooth; }
        body { background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; min-height:100vh; }
        a { text-decoration:none; color:inherit; }

        /* HEADER INTEGRATION */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.8rem 9%;
            background: rgba(31, 36, 45, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .navbar a,
        .back-btn {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.7);
            transition: color 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .back-btn:hover { color:var(--accent); }
        .back-btn i,
        #menu-icon {
            color: rgba(255,255,255,0.85);
        }
        .navbar { display:flex; gap:3.5rem; align-items: center; }
        .navbar a { font-size:1.5rem; color:var(--muted); transition:color 0.3s; }
        .navbar a:hover,
        .navbar a.active,
        .back-btn:hover {
            color: var(--accent);
        }       
        #menu-icon { font-size:3rem; color:var(--text); display:none; cursor:pointer; }

        /* HERO LAYOUT DESKTOP */
        .hero {
            min-height: calc(50vh - 8rem); 
            display:grid; grid-template-columns:1fr 1fr; gap:4rem;
            padding:12rem 9% 6rem; align-items:center;
        }
        .hero-info { display:flex; flex-direction:column; gap:2.4rem; }
        .project-category {
            display:inline-flex; align-items:center; gap:0.8rem;
            font-size:1.2rem; letter-spacing:0.15rem; text-transform:uppercase;
            color:var(--accent); font-weight:600;
        }
        .project-category::before { content:''; width:3rem; height:1px; background:var(--accent); }
        .hero-title { font-size:clamp(3.6rem,5vw,6rem); font-weight:800; line-height:1.1; letter-spacing:-0.02em; }
        .hero-title span { color:var(--accent); }
        .hero-meta { display:flex; gap:1.2rem; flex-wrap:wrap; }
        .meta-pill {
            display:flex; align-items:center; gap:0.6rem;
            padding:0.5rem 1.4rem; border-radius:10rem;
            border:1px solid var(--accent-border); background:var(--accent-dim);
            font-size:1.3rem; color:var(--accent);
        }
        .meta-pill i { font-size:1.6rem; }
        .hero-desc { font-size:1.6rem; line-height:1.8; color:rgba(255,255,255,0.75); max-width:46rem; }
        .tag-row { display:flex; flex-wrap:wrap; gap:0.8rem; }
        .tag {
            font-size:1.1rem; padding:0.4rem 1.2rem; border-radius:0.6rem;
            background:var(--bg2); border:1px solid rgba(255,255,255,0.1);
            color:rgba(255,255,255,0.7); letter-spacing:0.04rem;
        }
        .cta-row { display:flex; gap:1.2rem; flex-wrap:wrap; margin-top:0.4rem; }
        .btn-primary {
            display:inline-flex; align-items:center; gap:0.8rem;
            padding:1.1rem 2.8rem; background:var(--accent); color:var(--bg);
            border-radius:10rem; font-size:1.5rem; font-weight:700;
            transition:box-shadow 0.3s, transform 0.2s;
        }
        .btn-primary:hover { box-shadow:0 0 2rem rgba(0,238,255,0.4); transform:translateY(-2px); }
        .btn-secondary {
            display:inline-flex; align-items:center; gap:0.8rem;
            padding:1.1rem 2.8rem; background:transparent; color:var(--text);
            border:1px solid rgba(255,255,255,0.25); border-radius:10rem;
            font-size:1.5rem; font-weight:600; transition:border-color 0.3s, color 0.3s;
        }
        .btn-secondary:hover { border-color:var(--accent); color:var(--accent); }

        /* CAROUSEL DESKTOP STYLE */
        .hero-carousel { position:relative; padding:0 3.2rem; display: block; }
        .carousel-track-wrapper {
            width:100%; aspect-ratio:16/9;
            border-radius:1.6rem; overflow:hidden;
            border:1px solid rgba(0,238,255,0.2);
            background:var(--bg2); position:relative;
        }
        .carousel-track {
            display:flex; height:100%;
            transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);
            will-change:transform;
        }
        .carousel-slide { min-width:100%; height:100%; flex-shrink:0; }
        .carousel-slide img { width:100%; height:100%; object-fit:cover; display:block; }
        .carousel-slide iframe { width:100%; height:100%; border:none; display:block; }

        .c-btn {
            position:absolute; top:50%; transform:translateY(-50%);
            width:4.4rem; height:4.4rem; background:var(--bg2);
            border:1px solid var(--accent-border); border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; transition:background 0.3s, box-shadow 0.3s; z-index:10;
        }
        .c-btn:hover { background:var(--accent); box-shadow:0 0 1rem rgba(0,238,255,0.5); }
        .c-btn:hover i { color:var(--bg); }
        .c-btn i { font-size:2.2rem; color:var(--accent); transition:color 0.3s; }
        .c-btn.prev { left:0; }
        .c-btn.next { right:0; }

        .carousel-dots { display:flex; justify-content:center; gap:0.8rem; margin-top:1.6rem; }
        .dot { width:0.6rem; height:0.6rem; border-radius:50%; background:rgba(255,255,255,0.25); cursor:pointer; transition:all 0.3s; }
        .dot.active { background:var(--accent); width:2rem; border-radius:1rem; }

        /* MOBILE BLOCKS CONTAINER */
        .project-media-mobile-container {
            display: none;
            flex-direction: column;
            gap: 1.6rem;
            width: 100%;
        }
        .mobile-media-holder {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 1.2rem;
            border: 1px solid rgba(0,238,255,0.2);
            background: var(--bg2);
            overflow: hidden;
            position: relative;
        }
        .mobile-media-holder img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .mobile-media-holder iframe { width: 100%; height: 100%; border: none; display: block; }
        
        .zoom-hint {
            position: absolute; bottom: 1.2rem; right: 1.2rem;
            background: rgba(0, 0, 0, 0.65); color: #fff;
            padding: 0.4rem 1rem; border-radius: 0.6rem;
            font-size: 1.1rem; display: flex; align-items: center; gap: 0.4rem;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.1);
        }

        /* LIGHTBOX OVERLAY */
        .lightbox-overlay {
            position: fixed; inset: 0; background: rgba(10, 10, 10, 0.96);
            z-index: 999999; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .lightbox-overlay.active { opacity: 1; pointer-events: all; }
        .lightbox-img {
            max-width: 92vw; max-height: 85vh; object-fit: contain;
            border-radius: 0.8rem; transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .lightbox-overlay.active .lightbox-img { transform: scale(1); }
        .lightbox-close {
            position: absolute; top: 2.4rem; right: 2.4rem;
            font-size: 4rem; color: rgba(255,255,255,0.6); cursor: pointer; transition: color 0.3s;
        }
        .lightbox-close:hover { color: var(--accent); }

        /* DETAIL SECTION */
        .detail { background:var(--bg3); padding:8rem 9%; border-top:1px solid rgba(0,238,255,0.08); }
        .detail-grid { display:grid; grid-template-columns:2fr 1fr; gap:6rem; align-items:start; }
        .section-label { font-size:1.1rem; letter-spacing:0.15rem; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:1.6rem; }
        .detail-text h2 { font-size:3rem; font-weight:700; margin-bottom:2.4rem; line-height:1.2; }
        .detail-text p { font-size:1.6rem; line-height:1.9; color:rgba(255,255,255,0.75); margin-bottom:2rem; }
        .detail-text p:last-child { margin-bottom:0; }
        .detail-sidebar { display:flex; flex-direction:column; gap:2rem; }
        .info-card { background:var(--bg2); border:1px solid rgba(255,255,255,0.07); border-radius:1.4rem; padding:2.4rem; }
        .info-card h3 { font-size:1.2rem; letter-spacing:0.12rem; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:1.6rem; }
        .info-row { display:flex; justify-content:space-between; align-items:center; padding:0.9rem 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:1.4rem; }
        .info-row:last-child { border-bottom:none; padding-bottom:0; }
        .info-row .label { color:var(--muted); }
        .info-row .value { font-weight:600; color:var(--text); }
        .feat-list { display:flex; flex-direction:column; gap:1rem; }
        .feat-item { display:flex; align-items:center; gap:1.2rem; font-size:1.4rem; color:rgba(255,255,255,0.8); }
        .feat-item i { font-size:1.8rem; color:var(--accent); flex-shrink:0; }

        /* FOOTER */
        .footer { display:flex; justify-content:space-between; align-items:center; padding:2rem 9%; background:var(--bg2); font-size:1.4rem; color:var(--muted); }
        .footer a { display:inline-flex; align-items:center; justify-content:center; padding:0.8rem; background:var(--accent); border-radius:0.8rem; }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width:1024px) {
            .hero { grid-template-columns:1fr; padding-top:10rem; }
            .hero-desc { max-width:100%; }
            .detail-grid { grid-template-columns:1fr; gap:4rem; }
        }
        
        @media (max-width:768px) {
            html { font-size:55%; }
            #menu-icon { display:block; }
            
            /* FLOW NATIVO MOBILE */
            .hero { 
                display: flex; 
                flex-direction: column; 
                gap: 5rem; 
                padding: 12rem 5% 6rem;
            }
            .hero-info { width: 100%; }
            .hero-carousel { display: none !important; }
            .project-media-mobile-container { display: flex; gap: 1.6rem; width: 100%; }
            .mobile-media-holder { border-radius: 1.2rem; }
        }
    </style>
</head>

<!-- FILE TRADUZIONI STRUTTURALI GLOBALI -->
<script src="../js/translations.js"></script>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

// ── NAVIGAZIONE MOBILE RESPONSIVE ──
const menuIcon = document.getElementById('menu-icon');
const navbar   = document.querySelector('.navbar');
if (menuIcon && navbar) {
    menuIcon.addEventListener('click', () => navbar.classList.toggle('active'));
}

// ── REGOLATORE ENGINE LINGUA ULTRA-PROTETTO ──
function getInitialLanguage() {
    const supportedLanguages = ['en', 'it', 'fr', 'es'];
    
    // 1. Forza il controllo sul localStorage pulendo robaccia
    let savedLang = localStorage.getItem('preferred_lang');
    if (savedLang === 'null' || savedLang === 'undefined' || savedLang === '') {
        localStorage.removeItem('preferred_lang');
        savedLang = null;
    }
    
    if (savedLang && supportedLanguages.includes(savedLang.toLowerCase())) {
        console.log("🔍 [i18n Trace] Trovato nel localStorage:", savedLang.toLowerCase());
        return savedLang.toLowerCase();
    }

    // 2. Controllo Firefox nativo
    const browserLang = navigator.language || navigator.userLanguage;
    if (browserLang) {
        const shortLang = browserLang.toLowerCase().split('-')[0];
        if (supportedLanguages.includes(shortLang)) {
            console.log("🔍 [i18n Trace] Rilevato da impostazioni browser:", shortLang);
            return shortLang;
        }
    }
    
    console.log("🔍 [i18n Trace] Fallback finale su: en");
    return 'en';
}

function applyStructuralTranslations(lang) {
    if (typeof translations === 'undefined') {
        console.error("❌ [i18n Error] Dizionario 'translations' NON TROVATO!");
        return;
    }
    
    const supportedLanguages = ['en', 'it', 'fr', 'es'];
    if (!lang || !supportedLanguages.includes(lang.toLowerCase())) {
        console.warn("⚠️ [i18n Anti-Bug] Tentativo di salvare lingua non valida bloccato:", lang);
        return;
    }

    const finalLang = lang.toLowerCase();
    console.log("🚀 [i18n Action] Applicazione traduzioni navbar in:", finalLang);

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[finalLang] && translations[finalLang][key]) {
            el.innerHTML = translations[finalLang][key];
        }
    });
    
    // Scrive nel localStorage SOLO stringhe valide certificate
    localStorage.setItem('preferred_lang', finalLang);
}

// ── ENGINE GENERATORE DATI INLINE CORRETTO ──
function renderProject(p, lang) {
    console.log("🎨 [Render] Chiamato renderProject con lingua richiesta:", lang);
    
    document.getElementById('proj-meta').innerHTML = "";
    document.getElementById('proj-tags').innerHTML = "";
    document.getElementById('proj-cta').innerHTML = "";
    document.getElementById('track').innerHTML = "";
    document.getElementById('mobile-media-container').innerHTML = "";
    document.getElementById('proj-info-rows').innerHTML = "";
    document.getElementById('proj-features').innerHTML = "";

    const supportedLanguages = ['en', 'it', 'fr', 'es'];
    const finalLang = supportedLanguages.includes(lang) ? lang : 'en';

    // Se manca il blocco della lingua (es: manca 'it' in sandsofdawn.js), usa 'en'
    if (!p[finalLang]) {
        console.warn(`⚠️ [Render Fallback] Il file dati del progetto non ha il blocco '${finalLang}'. Uso il fallback inglese.`);
    }

    const data = p[finalLang] || p['en'];

    document.getElementById('page-title').textContent = data.title + ' - Portfolio - Andrea Bona';
    document.getElementById('page-desc').setAttribute('content', data.metaDesc || '');
    document.getElementById('proj-category').textContent = data.category;
    document.getElementById('proj-title').innerHTML = data.titleHTML;
    document.getElementById('proj-desc').textContent = data.shortDesc;

    const metaEl = document.getElementById('proj-meta');
    data.meta.forEach(m => {
        const pill = document.createElement('span');
        pill.className = 'meta-pill';
        pill.innerHTML = `<i class='bx ${m.icon}'></i> ${m.text}`;
        metaEl.appendChild(pill);
    });

    const projectTags = p.tags || data.tags || [];
    const tagEl = document.getElementById('proj-tags');
    projectTags.forEach(t => {
        const s = document.createElement('span');
        s.className = 'tag';
        s.textContent = t;
        tagEl.appendChild(s);
    });

    const ctaEl = document.getElementById('proj-cta');
    data.cta.forEach(c => {
        const a = document.createElement('a');
        a.href = c.href;
        if (c.external) a.target = '_blank';
        a.className = c.primary ? 'btn-primary' : 'btn-secondary';
        a.innerHTML = `<i class='bx ${c.icon}'></i> ${c.label}`;
        ctaEl.appendChild(a);
    });

    const track = document.getElementById('track');
    const mobileMediaContainer = document.getElementById('mobile-media-container');

    const projectSlides = p.slides || data.slides || [];
    projectSlides.forEach(s => {
        const slideDiv = document.createElement('div');
        slideDiv.className = 'carousel-slide';
        if (s.type === 'video') {
            slideDiv.innerHTML = `<iframe src="${s.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        } else {
            slideDiv.innerHTML = `<img src="${s.src}" alt="${s.alt || ''}"/>`;
        }
        track.appendChild(slideDiv);

        const mobileHolder = document.createElement('div');
        mobileHolder.className = 'mobile-media-holder';
        if (s.type === 'video') {
            mobileHolder.innerHTML = `<iframe src="${s.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        } else {
            mobileHolder.style.cursor = 'zoom-in';
            mobileHolder.innerHTML = `
                <img src="${s.src}" alt="${s.alt || ''}"/>
                <div class="zoom-hint"><i class='bx bx-zoom-in'></i> Zoom</div>
            `;
            mobileHolder.addEventListener('click', () => openLightbox(s.src));
        }
        mobileMediaContainer.appendChild(mobileHolder);
    });

    document.getElementById('detail-label').textContent   = data.detail.label;
    document.getElementById('detail-heading').textContent = data.detail.heading;
    document.getElementById('detail-body').innerHTML      = data.detail.bodyHTML;

    const rowsEl = document.getElementById('proj-info-rows');
    data.info.forEach(r => {
        const div = document.createElement('div');
        div.className = 'info-row';
        div.innerHTML = `<span class="label">${r.label}</span><span class="value">${r.value}</span>`;
        rowsEl.appendChild(div);
    });

    const featEl = document.getElementById('proj-features');
    data.features.forEach(f => {
        const div = document.createElement('div');
        div.className = 'feat-item';
        div.innerHTML = `<i class='bx ${f.icon}'></i> ${f.text}`;
        featEl.appendChild(div);
    });
}

// ── ENGINE SLIDER DESKTOP ─────────────────────────────────
let goToGlobal = null; 
function initCarousel() {
    const track   = document.getElementById('track');
    const slides  = track.querySelectorAll('.carousel-slide');
    const dotsEl  = document.getElementById('dots');
    const total   = slides.length;
    let current   = 0;

    dotsEl.innerHTML = ""; 
    if (total === 0) return;

    slides.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot' + (i === 0 ? ' active' : '');
        d.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(d);
    });

    function goTo(index) {
        current = ((index % total) + total) % total;
        track.style.transform = `translateX(-${current * 100}%)`;
        dotsEl.querySelectorAll('.dot').forEach((d, i) =>
            d.classList.toggle('active', i === current));
    }
    goToGlobal = goTo;

    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    
    prevBtn.replaceWith(prevBtn.cloneNode(true));
    nextBtn.replaceWith(nextBtn.cloneNode(true));

    document.getElementById('prev').addEventListener('click', () => goTo(current - 1));
    document.getElementById('next').addEventListener('click', () => goTo(current + 1));
}

// ── ENGINE LIGHTBOX SYSTEM ────────────────────────────────
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxClose = document.getElementById('lightbox-close');

function openLightbox(src) {
    if (!lightbox || !lightboxImg) return;
    lightboxImg.src = src;
    lightbox.classList.add('active');
}
function closeLightbox() {
    if (!lightbox) return;
    lightbox.classList.remove('active');
}
if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
if (lightbox) {
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });
}

// ── SETUP INITIALIZATION & DROPDOWN ENGINE ────────────────
document.addEventListener('DOMContentLoaded', () => {
    console.log("🏁 [DOM] Caricato. Avvio inizializzazione pagina progetto.");
    const dropdown = document.getElementById('lang-dropdown');
    const initialLang = getInitialLanguage(); 

    if (dropdown) {
        const selectedBtn = dropdown.querySelector('.dropdown-selected');
        const selectedFlag = dropdown.querySelector('.selected-flag');
        const selectedText = dropdown.querySelector('.selected-text');
        const options = dropdown.querySelectorAll('.dropdown-options li');

        function syncDropdownUI(lang) {
            options.forEach(opt => {
                opt.classList.remove('active');
                if (opt.getAttribute('data-value') === lang) {
                    opt.classList.add('active');
                    const content = opt.textContent.trim().split(' ');
                    if (selectedFlag) selectedFlag.textContent = content[0];
                    if (selectedText) selectedText.textContent = content[1];
                }
            });
        }

        selectedBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('active');
        });

        options.forEach(option => {
            option.addEventListener('click', function(e) {
                e.stopPropagation();
                const targetLang = this.getAttribute('data-value');
                console.log("🖱️ [Dropdown Click] Selezione manuale utente:", targetLang);
                
                applyStructuralTranslations(targetLang);
                syncDropdownUI(targetLang);
                
                if (window.PROJECT_DATA) {
                    renderProject(window.PROJECT_DATA, targetLang);
                    initCarousel();
                }
                dropdown.classList.remove('active');
            });
        });

        document.addEventListener('click', () => {
            dropdown.classList.remove('active');
        });

        syncDropdownUI(initialLang);
    }

    applyStructuralTranslations(initialLang);

    if (window.PROJECT_DATA) {
        renderProject(window.PROJECT_DATA, initialLang);
        initCarousel();
    } else {
        console.error('❌ [Critical Error] window.PROJECT_DATA non trovato.');
    }
});
</script>
