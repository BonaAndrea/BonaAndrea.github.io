<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="page-title">Project - Portfolio - Andrea Bona</title>
    <meta name="description" id="page-desc" content="">
    <link rel="icon" href="../images/webicon2.png" type="image/x-icon">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/navbar.css">
        <link rel="stylesheet" href="../css/project.css"/>
</head>
<body>

<header class="header">
    <a href="../index.html#portfolio" class="back-btn">
        <i class='bx bx-arrow-back'></i><span data-i18n="nav_projects">Projects</span>
    </a>
    <i class='bx bx-menu' id="menu-icon"></i>
    <nav class="navbar">
        <a href="../index.html#home" data-i18n="nav_home">Home</a>
        <a href="../index.html#about" data-i18n="nav_about">About</a>
        <a href="../index.html#services" data-i18n="nav_skills">Skills</a>
        <a href="../index.html#portfolio" class="active" data-i18n="nav_projects">Projects</a>

        <!-- DROPDOWN CUSTOM LINGUA -->
        <div class="custom-dropdown" id="lang-dropdown">
            <div class="dropdown-selected">
                <span class="selected-flag">🇬🇧</span> <span class="selected-text">EN</span>
                <i class='bx bx-chevron-down dropdown-arrow'></i>
            </div>
            <ul class="dropdown-options">
                <li data-value="en" class="active">🇬🇧 EN</li>
                <li data-value="it">🇮🇹 IT</li>
                <li data-value="fr">🇫🇷 FR</li>
                <li data-value="es">🇪🇸 ES</li>
            </ul>
        </div>
    </nav>
</header>

<section class="hero">
    <div class="hero-info">
        <span class="project-category" id="proj-category"></span>
        <h1 class="hero-title" id="proj-title"></h1>
        <div class="hero-meta" id="proj-meta"></div>
        <p class="hero-desc" id="proj-desc"></p>
        <div class="tag-row" id="proj-tags"></div>
        <div class="cta-row" id="proj-cta"></div>
    </div>
    
    <!-- CONTENITORE PC: CAROUSEL -->
    <div class="hero-carousel" id="desktop-carousel-wrap">
        <div class="carousel-track-wrapper">
            <div class="carousel-track" id="track"></div>
        </div>
        <button class="c-btn prev" id="prev" aria-label="Previous slide"><i class='bx bx-chevron-left'></i></button>
        <button class="c-btn next" id="next" aria-label="Next slide"><i class='bx bx-chevron-right'></i></button>
        <div class="carousel-dots" id="dots"></div>
    </div>

    <!-- CONTENITORE MOBILE -->
    <div class="project-media-mobile-container" id="mobile-media-container"></div>
</section>

<section class="detail">
    <div class="detail-grid">
        <div class="detail-text">
            <p class="section-label" id="detail-label"></p>
            <h2 id="detail-heading"></h2>
            <div id="detail-body"></div>
        </div>
        <div class="detail-sidebar">
            <div class="info-card">
                <h3 data-i18n="proj_info_title">Project info</h3>
                <div id="proj-info-rows"></div>
            </div>
            <div class="info-card">
                <h3 data-i18n="proj_features_title">Key features</h3>
                <div id="proj-features"></div>
            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <p>Copyright &copy; <span id="yr"></span> Andrea Bona · All Rights Reserved.</p>
    <a href="#" aria-label="Back to top"><i class='bx bx-up-arrow-alt'></i></a>
</footer>

<!-- LIGHTBOX MARKUP -->
<div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img src="" alt="Fullscreen preview" class="lightbox-img" id="lightbox-img">
</div>

<script src="../js/translations.js"></script>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const menuIcon = document.getElementById('menu-icon');
const navbar   = document.querySelector('.navbar');
if (menuIcon && navbar) {
    menuIcon.addEventListener('click', () => navbar.classList.toggle('active'));
}

function getInitialLanguage() {
    const savedLang = localStorage.getItem('preferred_lang');
    if (savedLang) return savedLang;
    const browserLang = navigator.language || navigator.userLanguage;
    if (browserLang) {
        const shortLang = browserLang.toLowerCase().split('-')[0];
        const supportedLanguages = ['en', 'it', 'fr', 'es'];
        if (supportedLanguages.includes(shortLang)) return shortLang;
    }
    return 'en';
}

function applyStructuralTranslations(lang) {
    if (typeof translations === 'undefined') return;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
            el.innerHTML = translations[lang][key];
        }
    });
    localStorage.setItem('preferred_lang', lang);
}

function renderProject(p, lang) {
    document.getElementById('proj-meta').innerHTML = "";
    document.getElementById('proj-tags').innerHTML = "";
    document.getElementById('proj-cta').innerHTML = "";
    document.getElementById('track').innerHTML = "";
    document.getElementById('mobile-media-container').innerHTML = "";
    document.getElementById('proj-info-rows').innerHTML = "";
    document.getElementById('proj-features').innerHTML = "";

    const data = p[lang] || p['en'] || p;

    document.getElementById('page-title').textContent = data.title + ' - Portfolio - Andrea Bona';
    document.getElementById('page-desc').setAttribute('content', data.metaDesc || '');
    document.getElementById('proj-category').textContent = data.category;
    document.getElementById('proj-title').innerHTML = data.titleHTML;
    document.getElementById('proj-desc').textContent = data.shortDesc;

    const metaEl = document.getElementById('proj-meta');
    data.meta.forEach(m => {
        const pill = document.createElement('span');
        pill.className = 'meta-pill';
        pill.innerHTML = `<i class='bx ${m.icon}'></i> ${m.text}`;
        metaEl.appendChild(pill);
    });

    const projectTags = p.tags || data.tags || [];
    const tagEl = document.getElementById('proj-tags');
    projectTags.forEach(t => {
        const s = document.createElement('span');
        s.className = 'tag';
        s.textContent = t;
        tagEl.appendChild(s);
    });

    // Inizializzazione protetta ed esplicita dell'elemento CTA
    const ctaEl = document.getElementById('proj-cta');
    data.cta.forEach(c => {
        const a = document.createElement('a');
        a.href = c.href;
        if (c.external) a.target = '_blank';
        a.className = c.primary ? 'btn-primary' : 'btn-secondary';
        a.innerHTML = `<i class='bx ${c.icon}'></i> ${c.label}`;
        ctaEl.appendChild(a);
    });

    const track = document.getElementById('track');
    const mobileMediaContainer = document.getElementById('mobile-media-container');

    const projectSlides = p.slides || data.slides || [];
    projectSlides.forEach(s => {
        const slideDiv = document.createElement('div');
        slideDiv.className = 'carousel-slide';
        if (s.type === 'video') {
            slideDiv.innerHTML = `<iframe src="${s.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        } else {
            slideDiv.innerHTML = `<img src="${s.src}" alt="${s.alt || ''}"/>`;
        }
        track.appendChild(slideDiv);

        const mobileHolder = document.createElement('div');
        mobileHolder.className = 'mobile-media-holder';
        if (s.type === 'video') {
            mobileHolder.innerHTML = `<iframe src="${s.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        } else {
            mobileHolder.style.cursor = 'zoom-in';
            mobileHolder.innerHTML = `
                <img src="${s.src}" alt="${s.alt || ''}"/>
                <div class="zoom-hint"><i class='bx bx-zoom-in'></i> Zoom</div>
            `;
            mobileHolder.addEventListener('click', () => openLightbox(s.src));
        }
        mobileMediaContainer.appendChild(mobileHolder);
    });

    document.getElementById('detail-label').textContent   = data.detail.label;
    document.getElementById('detail-heading').textContent = data.detail.heading;
    document.getElementById('detail-body').innerHTML      = data.detail.bodyHTML;

    const rowsEl = document.getElementById('proj-info-rows');
    data.info.forEach(r => {
        const div = document.createElement('div');
        div.className = 'info-row';
        div.innerHTML = `<span class="label">${r.label}</span><span class="value">${r.value}</span>`;
        rowsEl.appendChild(div);
    });

    const featEl = document.getElementById('proj-features');
    data.features.forEach(f => {
        const div = document.createElement('div');
        div.className = 'feat-item';
        div.innerHTML = `<i class='bx ${f.icon}'></i> ${f.text}`;
        featEl.appendChild(div);
    });
}

let goToGlobal = null; 
function initCarousel() {
    const track   = document.getElementById('track');
    const slides  = track.querySelectorAll('.carousel-slide');
    const dotsEl  = document.getElementById('dots');
    const total   = slides.length;
    let current   = 0;

    dotsEl.innerHTML = ""; 
    if (total === 0) return;

    slides.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot' + (i === 0 ? ' active' : '');
        d.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(d);
    });

    function goTo(index) {
        current = ((index % total) + total) % total;
        track.style.transform = `translateX(-${current * 100}%)`;
        dotsEl.querySelectorAll('.dot').forEach((d, i) =>
            d.classList.toggle('active', i === current));
    }
    goToGlobal = goTo;

    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    prevBtn.replaceWith(prevBtn.cloneNode(true));
    nextBtn.replaceWith(nextBtn.cloneNode(true));

    document.getElementById('prev').addEventListener('click', () => goTo(current - 1));
    document.getElementById('next').addEventListener('click', () => goTo(current + 1));
}

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxClose = document.getElementById('lightbox-close');

function openLightbox(src) {
    if (!lightbox || !lightboxImg) return;
    lightboxImg.src = src;
    lightbox.classList.add('active');
}
function closeLightbox() {
    if (!lightbox) return;
    lightbox.classList.remove('active');
}
if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
if (lightbox) {
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });
}

document.addEventListener('DOMContentLoaded', () => {
    const dropdown = document.getElementById('lang-dropdown');
    const initialLang = getInitialLanguage();

    if (dropdown) {
        const selectedBtn = dropdown.querySelector('.dropdown-selected');
        const selectedFlag = dropdown.querySelector('.selected-flag');
        const selectedText = dropdown.querySelector('.selected-text');
        const options = dropdown.querySelectorAll('.dropdown-options li');

        function syncDropdownUI(lang) {
            options.forEach(opt => {
                opt.classList.remove('active');
                if (opt.getAttribute('data-value') === lang) {
                    opt.classList.add('active');
                    const content = opt.textContent.trim().split(' ');
                    if (selectedFlag) selectedFlag.textContent = content[0];
                    if (selectedText) selectedText.textContent = content[1];
                }
            });
        }

        selectedBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('active');
        });

        options.forEach(option => {
            option.addEventListener('click', function(e) {
                e.stopPropagation();
                const targetLang = this.getAttribute('data-value');
                
                applyStructuralTranslations(targetLang);
                syncDropdownUI(targetLang);
                
                if (window.PROJECT_DATA) {
                    renderProject(window.PROJECT_DATA, targetLang);
                    initCarousel();
                }
                dropdown.classList.remove('active');
            });
        });

        document.addEventListener('click', () => {
            dropdown.classList.remove('active');
        });

        syncDropdownUI(initialLang);
    }

    applyStructuralTranslations(initialLang);

    if (window.PROJECT_DATA) {
        renderProject(window.PROJECT_DATA, initialLang);
        initCarousel();
    }
});
</script>
<script src="data/alpine-rescue2.js?v=1.4"></script>
</body>
</html>
