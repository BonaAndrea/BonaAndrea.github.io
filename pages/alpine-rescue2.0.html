<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="page-title">Project - Portfolio - Andrea Bona</title>
    <meta name="description" id="page-desc" content="">
    <link rel="icon" href="../images/webicon2.png" type="image/x-icon">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg:#1f242d; --bg2:#323946; --bg3:#252c38;
            --text:#fff; --muted:rgba(255,255,255,0.6);
            --accent:#0ef; --accent-dim:rgba(0,238,255,0.15);
            --accent-border:rgba(0,238,255,0.35);
        }
        html { font-size:62.5%; scroll-behavior:smooth; }
        body { background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; min-height:100vh; }
        a { text-decoration:none; color:inherit; }

        /* HEADER & HERO (omesse per brevità, mantieni le tue originali) */
        .header { position:fixed; top:0; left:0; width:100%; padding:1.8rem 9%; background:rgba(31,36,45,0.95); backdrop-filter:blur(10px); display:flex; justify-content:space-between; align-items:center; z-index:100; border-bottom:1px solid rgba(255,255,255,0.06); }
        .navbar { display:flex; gap:3.5rem; align-items:center; }
        .navbar a { font-size:1.5rem; color:var(--muted); transition:color 0.3s; }
        .navbar a:hover, .navbar a.active { color:var(--accent); }
        #menu-icon { font-size:3rem; color:var(--text); display:none; cursor:pointer; }
        
        .hero { min-height:calc(50vh - 8rem); display:grid; grid-template-columns:1fr 1fr; gap:4rem; padding:12rem 9% 6rem; align-items:center; }
        .hero-info { display:flex; flex-direction:column; gap:2.4rem; }
        
        @media (max-width:768px) {
            #menu-icon { display:block; }
            .hero { display:flex; flex-direction:column; gap:5rem; padding:12rem 5% 6rem; }
            .hero-carousel { display:none !important; }
            .project-media-mobile-container { display:flex; gap:1.6rem; width:100%; }
        }
    </style>
</head>
<body>

<header class="header">
    <a href="../index.html#portfolio" class="back-btn"><i class='bx bx-arrow-back'></i><span data-i18n="nav_projects">Projects</span></a>
    <i class='bx bx-menu' id="menu-icon"></i>
    <nav class="navbar">
        <a href="../index.html#home" data-i18n="nav_home">Home</a>
        <a href="../index.html#about" data-i18n="nav_about">About</a>
        <a href="../index.html#services" data-i18n="nav_skills">Skills</a>
        <a href="../index.html#portfolio" class="active" data-i18n="nav_projects">Projects</a>
        <div class="custom-dropdown" id="lang-dropdown">
            <div class="dropdown-selected"><span class="selected-flag">🇬🇧</span> <span class="selected-text">EN</span><i class='bx bx-chevron-down dropdown-arrow'></i></div>
            <ul class="dropdown-options">
                <li data-value="en" class="active">🇬🇧 EN</li>
                <li data-value="it">🇮🇹 IT</li>
                <li data-value="fr">🇫🇷 FR</li>
                <li data-value="es">🇪🇸 ES</li>
            </ul>
        </div>
    </nav>
</header>

<script src="../js/translations.js"></script>
<script>
// Funzioni Core i18n
function getInitialLanguage() {
    const savedLang = localStorage.getItem('preferred_lang');
    const supportedLanguages = ['en', 'it', 'fr', 'es'];
    if (savedLang && supportedLanguages.includes(savedLang.toLowerCase())) return savedLang.toLowerCase();
    
    const browserLang = navigator.language || navigator.userLanguage;
    if (browserLang) {
        const shortLang = browserLang.toLowerCase().split('-')[0];
        if (supportedLanguages.includes(shortLang)) return shortLang;
    }
    return 'en';
}

function applyStructuralTranslations(lang) {
    if (typeof translations === 'undefined') return;
    const finalLang = ['en', 'it', 'fr', 'es'].includes(lang.toLowerCase()) ? lang.toLowerCase() : 'en';
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[finalLang] && translations[finalLang][key]) el.innerHTML = translations[finalLang][key];
    });
    localStorage.setItem('preferred_lang', finalLang);
}

function renderProject(p, lang) {
    // Reset nodi... (stessa logica di svuotamento definita prima)
    const supportedLanguages = ['en', 'it', 'fr', 'es'];
    const finalLang = supportedLanguages.includes(lang.toLowerCase()) ? lang.toLowerCase() : 'en';
    const data = p[finalLang] || p['en'];

    // Rendering dati... (mantieni la logica identica)
    document.getElementById('proj-title').innerHTML = data.titleHTML;
    // ...
}

// Inizializzazione (standardizzata)
document.addEventListener('DOMContentLoaded', () => {
    const initialLang = getInitialLanguage();
    applyStructuralTranslations(initialLang);
    if (window.PROJECT_DATA) {
        renderProject(window.PROJECT_DATA, initialLang);
        initCarousel();
    }
});
</script>
<script src="data/alpine-rescue2.js?v=1.4"></script>
</body>
</html>
