<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="page-title">Project - Portfolio - Andrea Bona</title>
    <meta name="description" id="page-desc" content="">
    <link rel="icon" href="../images/webicon2.png" type="image/x-icon">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/project.css"/>
</head>
<body>

<header class="header">
    <a href="../index.html#portfolio" class="back-btn">
        <i class='bx bx-arrow-back'></i><span>Projects</span>
    </a>
    <i class='bx bx-menu' id="menu-icon"></i>
    <nav class="navbar">
        <a href="../index.html#home">Home</a>
        <a href="../index.html#about">About</a>
        <a href="../index.html#services">Skills</a>
        <a href="../index.html#demos">Demos</a>
        <a href="../index.html#portfolio" class="active">Projects</a>
        <a href="../index.html#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-info">
        <span class="project-category" id="proj-category"></span>
        <h1 class="hero-title" id="proj-title"></h1>
        <div class="hero-meta" id="proj-meta"></div>
        <p class="hero-desc" id="proj-desc"></p>
        <div class="tag-row" id="proj-tags"></div>
        <div class="cta-row" id="proj-cta"></div>
    </div>
    <div class="project-media-container" id="media-container"></div>
</section>

<section class="detail">
    <div class="detail-grid">
        <div class="detail-text">
            <p class="section-label" id="detail-label"></p>
            <h2 id="detail-heading"></h2>
            <div id="detail-body"></div>
        </div>
        <div class="detail-sidebar">
            <div class="info-card">
                <h3>Project info</h3>
                <div id="proj-info-rows"></div>
            </div>
            <div class="info-card">
                <h3>Key features</h3>
                <div id="proj-features"></div>
            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <p>Copyright &copy; <span id="yr"></span> Andrea Bona · All Rights Reserved.</p>
    <a href="#" aria-label="Back to top"><i class='bx bx-up-arrow-alt'></i></a>
</footer>

<div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img src="" alt="Fullscreen preview" class="lightbox-img" id="lightbox-img">
</div>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const menuIcon = document.getElementById('menu-icon');
const navbar   = document.querySelector('.navbar');
menuIcon.addEventListener('click', () => navbar.classList.toggle('active'));

// ── RENDER STRUTTURA DATI PROGETTO ────────────────────────
function renderProject(p) {
    document.getElementById('page-title').textContent = p.title + ' - Portfolio - Andrea Bona';
    document.getElementById('page-desc').setAttribute('content', p.metaDesc || '');
    document.getElementById('proj-category').textContent = p.category;
    document.getElementById('proj-title').innerHTML = p.titleHTML;

    const metaEl = document.getElementById('proj-meta');
    p.meta.forEach(m => {
        const pill = document.createElement('span');
        pill.className = 'meta-pill';
        pill.innerHTML = `<i class='bx ${m.icon}'></i> ${m.text}`;
        metaEl.appendChild(pill);
    });

    document.getElementById('proj-desc').textContent = p.shortDesc;

    const tagEl = document.getElementById('proj-tags');
    p.tags.forEach(t => {
        const s = document.createElement('span');
        s.className = 'tag';
        s.textContent = t;
        tagEl.appendChild(s);
    });

    const ctaEl = document.getElementById('proj-cta');
    p.cta.forEach(c => {
        const a = document.createElement('a');
        a.href = c.href;
        if (c.external) a.target = '_blank';
        a.className = c.primary ? 'btn-primary' : 'btn-secondary';
        a.innerHTML = `<i class='bx ${c.icon}'></i> ${c.label}`;
        ctaEl.appendChild(a);
    });

    // GENERA LE IMMAGINI/VIDEO NATIVI NELLA GRIGLIA
    const mediaContainer = document.getElementById('media-container');
    p.slides.forEach(s => {
        const holder = document.createElement('div');
        holder.className = 'media-holder';
        
        if (s.type === 'video') {
            // Se è un video lasciamo l'iframe (non viene zoomato per ovvi motivi)
            holder.style.cursor = 'default';
            holder.innerHTML = `<iframe src="${s.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        } else {
            // Se è un'immagine, applichiamo la logica e il trigger di click per il Lightbox
            holder.innerHTML = `
                <img src="${s.src}" alt="${s.alt || 'Project screenshot'}" class="zoomable-img"/>
                <div class="zoom-hint"><i class='bx bx-zoom-in'></i> Zoom</div>
            `;
            
            // Evento click per aprire questa specifica immagine nel Lightbox full-screen
            holder.addEventListener('click', () => {
                openLightbox(s.src);
            });
        }
        mediaContainer.appendChild(holder);
    });

    document.getElementById('detail-label').textContent   = p.detail.label;
    document.getElementById('detail-heading').textContent = p.detail.heading;
    document.getElementById('detail-body').innerHTML      = p.detail.bodyHTML;

    const rowsEl = document.getElementById('proj-info-rows');
    p.info.forEach(r => {
        const div = document.createElement('div');
        div.className = 'info-row';
        div.innerHTML = `<span class="label">${r.label}</span><span class="value">${r.value}</span>`;
        rowsEl.appendChild(div);
    });

    const featEl = document.getElementById('proj-features');
    p.features.forEach(f => {
        const div = document.createElement('div');
        div.className = 'feat-item';
        div.innerHTML = `<i class='bx ${f.icon}'></i> ${f.text}`;
        featEl.appendChild(div);
    });
}

// ── SISTEMA LIGHTBOX NATIVO ─────────────────────────────
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxClose = document.getElementById('lightbox-close');

function openLightbox(src) {
    if (!lightbox || !lightboxImg) return;
    lightboxImg.src = src;
    lightbox.classList.add('active');
}

function closeLightbox() {
    if (!lightbox) return;
    lightbox.classList.remove('active');
}

// Chiudi cliccando sulla X o in un punto vuoto dello sfondo nero
if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
if (lightbox) {
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });
}

// Chiudi premendo il tasto ESC della tastiera
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
});

// ── INIZIALIZZAZIONE ───────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    if (window.PROJECT_DATA) {
        renderProject(window.PROJECT_DATA);
    } else {
        console.error('PROJECT_DATA non trovato.');
    }
});
</script>
</body>
</html>
