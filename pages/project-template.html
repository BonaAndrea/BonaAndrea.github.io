<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="page-title">Project - Portfolio - Andrea Bona</title>
    <meta name="description" id="page-desc" content="">
    <link rel="icon" href="../images/webicon2.png" type="image/x-icon">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        
        :root {
            --bg:#1f242d; --bg2:#323946; --bg3:#252c38;
            --text:#fff; --muted:rgba(255,255,255,0.6);
            --accent:#0ef; --accent-dim:rgba(0,238,255,0.15);
            --accent-border:rgba(0,238,255,0.35);
        }
        
        html { font-size:62.5%; scroll-behavior:smooth; }
        body { background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; min-height:100vh; }
        a { text-decoration:none; color:inherit; }

        /* HEADER */
        .header {
            position:fixed; top:0; left:0; width:100%;
            padding:1.8rem 9%;
            background:rgba(31,36,45,0.92);
            backdrop-filter:blur(8px);
            display:flex; justify-content:space-between; align-items:center;
            z-index:100;
            border-bottom:1px solid rgba(0,238,255,0.08);
        }
        .back-btn { display:flex; align-items:center; gap:0.8rem; font-size:1.5rem; color:var(--muted); transition:color 0.3s; }
        .back-btn:hover { color:var(--accent); }
        .back-btn i { font-size:2rem; }
        .navbar { display:flex; gap:3.5rem; }
        .navbar a { font-size:1.5rem; color:var(--muted); transition:color 0.3s; }
        .navbar a:hover, .navbar a.active { color:var(--accent); }
        #menu-icon { font-size:3rem; color:var(--text); display:none; cursor:pointer; }

        /* HERO LAYOUT */
        .hero {
            min-height:100vh;
            display:grid; grid-template-columns:1fr 1fr; gap:6rem;
            padding:14rem 9% 6rem; align-items:center;
        }
        .hero-info { display:flex; flex-direction:column; gap:2.4rem; }
        .project-category {
            display:inline-flex; align-items:center; gap:0.8rem;
            font-size:1.2rem; letter-spacing:0.15rem; text-transform:uppercase;
            color:var(--accent); font-weight:600;
        }
        .project-category::before { content:''; width:3rem; height:1px; background:var(--accent); }
        .hero-title { font-size:clamp(3.6rem,5vw,6rem); font-weight:800; line-height:1.1; letter-spacing:-0.02em; }
        .hero-title span { color:var(--accent); }
        .hero-meta { display:flex; gap:1.2rem; flex-wrap:wrap; }
        .meta-pill {
            display:flex; align-items:center; gap:0.6rem;
            padding:0.5rem 1.4rem; border-radius:10rem;
            border:1px solid var(--accent-border); background:var(--accent-dim);
            font-size:1.3rem; color:var(--accent);
        }
        .meta-pill i { font-size:1.6rem; }
        .hero-desc { font-size:1.6rem; line-height:1.8; color:rgba(255,255,255,0.75); max-width:100%; }
        .tag-row { display:flex; flex-wrap:wrap; gap:0.8rem; }
        .tag {
            font-size:1.1rem; padding:0.4rem 1.2rem; border-radius:0.6rem;
            background:var(--bg2); border:1px solid rgba(255,255,255,0.1);
            color:rgba(255,255,255,0.7); letter-spacing:0.04rem;
        }
        .cta-row { display:flex; gap:1.2rem; flex-wrap:wrap; margin-top:0.4rem; }
        .btn-primary {
            display:inline-flex; align-items:center; gap:0.8rem;
            padding:1.1rem 2.8rem; background:var(--accent); color:var(--bg);
            border-radius:10rem; font-size:1.5rem; font-weight:700;
            transition:box-shadow 0.3s, transform 0.2s;
        }
        .btn-primary:hover { box-shadow:0 0 2rem rgba(0,238,255,0.4); transform:translateY(-2px); }
        .btn-secondary {
            display:inline-flex; align-items:center; gap:0.8rem;
            padding:1.1rem 2.8rem; background:transparent; color:var(--text);
            border:1px solid rgba(255,255,255,0.25); border-radius:10rem;
            font-size:1.5rem; font-weight:600; transition:border-color 0.3s, color 0.3s;
        }
        .btn-secondary:hover { border-color:var(--accent); color:var(--accent); }

        /* NUOVA GRIGLIA IMMAGINI PROGETTO (SOSTITUISCE IL CAROUSEL) */
        .project-media-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
        }
        .media-holder {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 1.6rem;
            border: 1px solid rgba(0,238,255,0.2);
            background: var(--bg2);
            overflow: hidden;
            position: relative;
            cursor: zoom-in;
            box-shadow: 0 1rem 3rem rgba(0,0,0,0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .media-holder:hover {
            transform: scale(1.02);
            border-color: var(--accent);
        }
        .media-holder img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .media-holder iframe {
            width: 100%; height: 100%; border: none; display: block;
        }
        /* Badge indicatore di click zoom */
        .zoom-hint {
            position: absolute; bottom: 1.2rem; right: 1.2rem;
            background: rgba(0, 0, 0, 0.65); color: #fff;
            padding: 0.4rem 1rem; border-radius: 0.6rem;
            font-size: 1.1rem; display: flex; align-items: center; gap: 0.4rem;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.1);
        }

        /* ── LIGHTBOX OVERLAY (FULLSCREEN SYSTEM) ──────────────── */
        .lightbox-overlay {
            position: fixed; inset: 0; background: rgba(10, 10, 10, 0.96);
            z-index: 999999; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .lightbox-overlay.active {
            opacity: 1; pointer-events: all;
        }
        .lightbox-img {
            max-width: 92vw; max-height: 85vh; object-fit: contain;
            border-radius: 0.8rem; transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .lightbox-overlay.active .lightbox-img {
            transform: scale(1);
        }
        .lightbox-close {
            position: absolute; top: 2.4rem; right: 2.4rem;
            font-size: 4rem; color: rgba(255,255,255,0.6);
            cursor: pointer; transition: color 0.3s;
        }
        .lightbox-close:hover { color: var(--accent); }

        /* DETAIL SECTION */
        .detail { background:var(--bg3); padding:8rem 9%; border-top:1px solid rgba(0,238,255,0.08); }
        .detail-grid { display:grid; grid-template-columns:2fr 1fr; gap:6rem; align-items:start; }
        .section-label { font-size:1.1rem; letter-spacing:0.15rem; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:1.6rem; }
        .detail-text h2 { font-size:3rem; font-weight:700; margin-bottom:2.4rem; line-height:1.2; }
        .detail-text p { font-size:1.6rem; line-height:1.9; color:rgba(255,255,255,0.75); margin-bottom:2rem; }
        .detail-text p:last-child { margin-bottom:0; }
        .detail-text span { color:var(--accent); font-weight:600; }
        .detail-sidebar { display:flex; flex-direction:column; gap:2rem; }
        .info-card { background:var(--bg2); border:1px solid rgba(255,255,255,0.07); border-radius:1.4rem; padding:2.4rem; }
        .info-card h3 { font-size:1.2rem; letter-spacing:0.12rem; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:1.6rem; }
        .info-row { display:flex; justify-content:space-between; align-items:center; padding:0.9rem 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:1.4rem; }
        .info-row:last-child { border-bottom:none; padding-bottom:0; }
        .info-row .label { color:var(--muted); }
        .info-row .value { font-weight:600; color:var(--text); }
        .feat-list { display:flex; flex-direction:column; gap:1rem; }
        .feat-item { display:flex; align-items:center; gap:1.2rem; font-size:1.4rem; color:rgba(255,255,255,0.8); }
        .feat-item i { font-size:1.8rem; color:var(--accent); flex-shrink:0; }

        /* FOOTER */
        .footer { display:flex; justify-content:space-between; align-items:center; padding:2rem 9%; background:var(--bg2); font-size:1.4rem; color:var(--muted); }
        .footer a { display:inline-flex; align-items:center; justify-content:center; padding:0.8rem; background:var(--accent); border-radius:0.8rem; transition:box-shadow 0.3s; }
        .footer a:hover { box-shadow:0 0 1rem var(--accent); }
        .footer a i { font-size:2rem; color:var(--bg); }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width:1024px) {
            .header { padding: 1.8rem 5%; }
            .hero { grid-template-columns:1fr; padding: 12rem 5% 6rem; gap: 5rem; min-height: auto; }
            .detail { padding: 6rem 5%; }
            .detail-grid { grid-template-columns:1fr; gap:4rem; }
            .footer { padding: 2rem 5%; }
        }
        
        @media (max-width:768px) {
            html { font-size:55%; }
            #menu-icon { display:block; }
            .navbar {
                position:absolute; top:100%; left:0; width:100%;
                flex-direction:column; gap:0; background:var(--bg);
                border-top:1px solid rgba(255,255,255,0.07);
                display:none; padding:1rem 5%;
                box-shadow: 0 1rem 2rem rgba(0,0,0,0.3);
            }
            .navbar.active { display:flex; }
            .navbar a { padding:1.2rem 0; font-size:1.7rem; border-bottom:1px solid rgba(255,255,255,0.05); }
            
            /* Su mobile mostra prima le immagini grandi e poi le scritte */
            .hero { display: flex; flex-direction: column-reverse; gap: 4rem; }
            .hero-info { width: 100%; }
            .project-media-container { gap: 1.6rem; }
            .media-holder { border-radius: 1.2rem; }
        }
    </style>
</head>
<body>

<header class="header">
    <a href="../index.html#portfolio" class="back-btn">
        <i class='bx bx-arrow-back'></i><span>Projects</span>
    </a>
    <i class='bx bx-menu' id="menu-icon"></i>
    <nav class="navbar">
        <a href="../index.html#home">Home</a>
        <a href="../index.html#about">About</a>
        <a href="../index.html#services">Skills</a>
        <a href="../index.html#demos">Demos</a>
        <a href="../index.html#portfolio" class="active">Projects</a>
        <a href="../index.html#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-info">
        <span class="project-category" id="proj-category"></span>
        <h1 class="hero-title" id="proj-title"></h1>
        <div class="hero-meta" id="proj-meta"></div>
        <p class="hero-desc" id="proj-desc"></p>
        <div class="tag-row" id="proj-tags"></div>
        <div class="cta-row" id="proj-cta"></div>
    </div>
    <div class="project-media-container" id="media-container"></div>
</section>

<section class="detail">
    <div class="detail-grid">
        <div class="detail-text">
            <p class="section-label" id="detail-label"></p>
            <h2 id="detail-heading"></h2>
            <div id="detail-body"></div>
        </div>
        <div class="detail-sidebar">
            <div class="info-card">
                <h3>Project info</h3>
                <div id="proj-info-rows"></div>
            </div>
            <div class="info-card">
                <h3>Key features</h3>
                <div id="proj-features"></div>
            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <p>Copyright &copy; <span id="yr"></span> Andrea Bona · All Rights Reserved.</p>
    <a href="#" aria-label="Back to top"><i class='bx bx-up-arrow-alt'></i></a>
</footer>

<div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img src="" alt="Fullscreen preview" class="lightbox-img" id="lightbox-img">
</div>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const menuIcon = document.getElementById('menu-icon');
const navbar   = document.querySelector('.navbar');
menuIcon.addEventListener('click', () => navbar.classList.toggle('active'));

// ── RENDER STRUTTURA DATI PROGETTO ────────────────────────
function renderProject(p) {
    document.getElementById('page-title').textContent = p.title + ' - Portfolio - Andrea Bona';
    document.getElementById('page-desc').setAttribute('content', p.metaDesc || '');
    document.getElementById('proj-category').textContent = p.category;
    document.getElementById('proj-title').innerHTML = p.titleHTML;

    const metaEl = document.getElementById('proj-meta');
    p.meta.forEach(m => {
        const pill = document.createElement('span');
        pill.className = 'meta-pill';
        pill.innerHTML = `<i class='bx ${m.icon}'></i> ${m.text}`;
        metaEl.appendChild(pill);
    });

    document.getElementById('proj-desc').textContent = p.shortDesc;

    const tagEl = document.getElementById('proj-tags');
    p.tags.forEach(t => {
        const s = document.createElement('span');
        s.className = 'tag';
        s.textContent = t;
        tagEl.appendChild(s);
    });

    const ctaEl = document.getElementById('proj-cta');
    p.cta.forEach(c => {
        const a = document.createElement('a');
        a.href = c.href;
        if (c.external) a.target = '_blank';
        a.className = c.primary ? 'btn-primary' : 'btn-secondary';
        a.innerHTML = `<i class='bx ${c.icon}'></i> ${c.label}`;
        ctaEl.appendChild(a);
    });

    // GENERA LE IMMAGINI/VIDEO NATIVI NELLA GRIGLIA
    const mediaContainer = document.getElementById('media-container');
    p.slides.forEach(s => {
        const holder = document.createElement('div');
        holder.className = 'media-holder';
        
        if (s.type === 'video') {
            // Se è un video lasciamo l'iframe (non viene zoomato per ovvi motivi)
            holder.style.cursor = 'default';
            holder.innerHTML = `<iframe src="${s.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        } else {
            // Se è un'immagine, applichiamo la logica e il trigger di click per il Lightbox
            holder.innerHTML = `
                <img src="${s.src}" alt="${s.alt || 'Project screenshot'}" class="zoomable-img"/>
                <div class="zoom-hint"><i class='bx bx-zoom-in'></i> Zoom</div>
            `;
            
            // Evento click per aprire questa specifica immagine nel Lightbox full-screen
            holder.addEventListener('click', () => {
                openLightbox(s.src);
            });
        }
        mediaContainer.appendChild(holder);
    });

    document.getElementById('detail-label').textContent   = p.detail.label;
    document.getElementById('detail-heading').textContent = p.detail.heading;
    document.getElementById('detail-body').innerHTML      = p.detail.bodyHTML;

    const rowsEl = document.getElementById('proj-info-rows');
    p.info.forEach(r => {
        const div = document.createElement('div');
        div.className = 'info-row';
        div.innerHTML = `<span class="label">${r.label}</span><span class="value">${r.value}</span>`;
        rowsEl.appendChild(div);
    });

    const featEl = document.getElementById('proj-features');
    p.features.forEach(f => {
        const div = document.createElement('div');
        div.className = 'feat-item';
        div.innerHTML = `<i class='bx ${f.icon}'></i> ${f.text}`;
        featEl.appendChild(div);
    });
}

// ── SISTEMA LIGHTBOX NATIVO ─────────────────────────────
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxClose = document.getElementById('lightbox-close');

function openLightbox(src) {
    if (!lightbox || !lightboxImg) return;
    lightboxImg.src = src;
    lightbox.classList.add('active');
}

function closeLightbox() {
    if (!lightbox) return;
    lightbox.classList.remove('active');
}

// Chiudi cliccando sulla X o in un punto vuoto dello sfondo nero
if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
if (lightbox) {
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });
}

// Chiudi premendo il tasto ESC della tastiera
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
});

// ── INIZIALIZZAZIONE ───────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    if (window.PROJECT_DATA) {
        renderProject(window.PROJECT_DATA);
    } else {
        console.error('PROJECT_DATA non trovato.');
    }
});
</script>
</body>
</html>
