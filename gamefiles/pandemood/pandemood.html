<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="page-title">Demo - Portfolio - Andrea Bona</title>
    <meta name="description" id="page-desc" content="">
    <link rel="icon" href="../../images/webicon2.png" type="image/x-icon">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        
        :root {
            --bg:#1f242d; --bg2:#323946; --bg3:#252c38;
            --text:#fff; --muted:rgba(255,255,255,0.6);
            --accent:#0ef; --accent-dim:rgba(0,238,255,0.15);
            --accent-border:rgba(0,238,255,0.35);
        }
        
        html { font-size:62.5%; scroll-behavior:smooth; }
        body { background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        a { text-decoration:none; color:inherit; }

        /* HEADER */
        .header {
            position:fixed; top:0; left:0; width:100%;
            padding:1.8rem 9%;
            background:rgba(31,36,45,0.92);
            backdrop-filter:blur(8px);
            display:flex; justify-content:space-between; align-items:center;
            z-index:100;
            border-bottom:1px solid rgba(0,238,255,0.08);
        }
        .back-btn { display:flex; align-items:center; gap:0.8rem; font-size:1.5rem; color:var(--muted); transition:color 0.3s; }
        .back-btn:hover { color:var(--accent); }
        .back-btn i { font-size:2rem; }
        .navbar { display:flex; gap:3.5rem; }
        .navbar a { font-size:1.5rem; color:var(--muted); transition:color 0.3s; }
        .navbar a:hover, .navbar a.active { color:var(--accent); }
        #menu-icon { font-size:3rem; color:var(--text); display:none; cursor:pointer; }

        /* MAIN CONTENT */
        .demo-page {
            flex:1;
            padding: 14rem 9% 4rem;
            display:flex;
            flex-direction:column;
            gap:3rem;
        }

        /* HERO LAYOUT */
        .demo-hero {
            display:grid;
            grid-template-columns:1fr 2fr;
            gap:4rem;
            align-items:start;
        }

        .demo-info { display:flex; flex-direction:column; gap:2rem; }

        .project-category {
            display:inline-flex; align-items:center; gap:0.8rem;
            font-size:1.2rem; letter-spacing:0.15rem; text-transform:uppercase;
            color:var(--accent); font-weight:600;
        }
        .project-category::before { content:''; width:3rem; height:1px; background:var(--accent); }

        .demo-title { font-size:clamp(3rem,4vw,5rem); font-weight:800; line-height:1.1; }
        .demo-title span { color:var(--accent); }

        .demo-meta { display:flex; gap:1rem; flex-wrap:wrap; }
        .meta-pill {
            display:flex; align-items:center; gap:0.6rem;
            padding:0.5rem 1.4rem; border-radius:10rem;
            border:1px solid var(--accent-border); background:var(--accent-dim);
            font-size:1.3rem; color:var(--accent);
        }
        .meta-pill i { font-size:1.6rem; }

        .demo-desc { font-size:1.5rem; line-height:1.8; color:rgba(255,255,255,0.75); }

        .tag-row { display:flex; flex-wrap:wrap; gap:0.8rem; }
        .tag {
            font-size:1.1rem; padding:0.4rem 1.2rem; border-radius:0.6rem;
            background:var(--bg2); border:1px solid rgba(255,255,255,0.1);
            color:rgba(255,255,255,0.7);
        }

        .cta-row { display:flex; gap:1.2rem; flex-wrap:wrap; }
        .btn-primary {
            display:inline-flex; align-items:center; gap:0.8rem;
            padding:1rem 2.4rem; background:var(--accent); color:var(--bg);
            border-radius:10rem; font-size:1.4rem; font-weight:700;
            transition:box-shadow 0.3s, transform 0.2s;
        }
        .btn-primary:hover { box-shadow:0 0 2rem rgba(0,238,255,0.4); transform:translateY(-2px); }
        .btn-secondary {
            display:inline-flex; align-items:center; gap:0.8rem;
            padding:1rem 2.4rem; background:transparent; color:var(--text);
            border:1px solid rgba(255,255,255,0.25); border-radius:10rem;
            font-size:1.4rem; font-weight:600; transition:border-color 0.3s, color 0.3s;
        }
        .btn-secondary:hover { border-color:var(--accent); color:var(--accent); }

        /* UNITY PLAYER CONTAINER */
        .unity-wrapper {
            background:var(--bg3);
            border:1px solid rgba(0,238,255,0.2);
            border-radius:1.6rem;
            overflow:hidden;
            position:relative;
            width: 100%;
            aspect-ratio: 16/9;
        }
        .unity-wrapper canvas {
            width:100% !important;
            height:100% !important;
            display:block;
        }

        /* Loading & Block overlay mobile */
        #unity-loading-bar {
            position:absolute; inset:0;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            background:var(--bg3); gap:1.6rem;
            padding: 2rem;
            text-align: center;
        }
        #unity-loading-bar i.mobile-block-icon {
            font-size: 5rem;
            color: var(--accent);
            text-shadow: 0 0 1.5rem rgba(0,238,255,0.4);
        }
        #unity-loading-bar p { font-size:1.5rem; color:var(--text); line-height: 1.4; }
        #unity-progress-bar-empty {
            width:60%; height:0.6rem;
            background:rgba(255,255,255,0.1);
            border-radius:10rem; overflow:hidden;
        }
        #unity-progress-bar-full {
            height:100%; width:0%;
            background:var(--accent);
            border-radius:10rem;
            transition:width 0.3s ease;
        }

        /* Fullscreen button */
        .fullscreen-btn {
            position:absolute; bottom:1.2rem; right:1.2rem;
            background:rgba(31,36,45,0.8);
            border:1px solid var(--accent-border);
            border-radius:0.8rem;
            padding:0.6rem 0.8rem;
            cursor:pointer; color:var(--accent);
            font-size:1.8rem; display:flex; align-items:center;
            transition:background 0.3s;
            z-index: 5;
        }
        .fullscreen-btn:hover { background:var(--accent); color:var(--bg); }

        /* FOOTER */
        .footer {
            display:flex; justify-content:space-between; align-items:center;
            padding:2rem 9%; background:var(--bg2);
            font-size:1.4rem; color:var(--muted);
        }
        .footer a {
            display:inline-flex; align-items:center; justify-content:center;
            padding:0.8rem; background:var(--accent); border-radius:0.8rem;
            transition:box-shadow 0.3s;
        }
        .footer a:hover { box-shadow:0 0 1rem var(--accent); }
        .footer a i { font-size:2rem; color:var(--bg); }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width:1024px) {
            .header { padding: 1.8rem 5%; }
            .demo-page { padding: 12rem 5% 4rem; }
            .demo-hero { grid-template-columns:1fr; gap: 5rem; }
            .footer { padding: 2rem 5%; }
        }
        @media (max-width:768px) {
            html { font-size:55%; }
            #menu-icon { display:block; }
            .navbar {
                position:absolute; top:100%; left:0; width:100%;
                flex-direction:column; gap:0; background:var(--bg);
                border-top:1px solid rgba(255,255,255,0.07);
                display:none; padding:1rem 5%;
                box-shadow: 0 1rem 2rem rgba(0,0,0,0.3);
            }
            .navbar.active { display:flex; }
            .navbar a { padding:1.2rem 0; font-size:1.7rem; border-bottom:1px solid rgba(255,255,255,0.05); }
            
            .fullscreen-btn { display: none !important; }
            .unity-wrapper { border-radius: 1.2rem; }
        }
    </style>
</head>
<body>

<header class="header">
    <a href="../../index.html#demos" class="back-btn">
        <i class='bx bx-arrow-back'></i><span>Demos</span>
    </a>
    <i class='bx bx-menu' id="menu-icon"></i>
    <nav class="navbar">
        <a href="../../index.html#home">Home</a>
        <a href="../../index.html#about">About</a>
        <a href="../../index.html#services">Skills</a>
        <a href="../../index.html#demos" class="active">Demos</a>
        <a href="../../index.html#portfolio">Projects</a>
        <a href="../../index.html#contact">Contact</a>
    </nav>
</header>

<main class="demo-page">
    <div class="demo-hero">

        <!-- LEFT: info -->
        <div class="demo-info">
            <span class="project-category" id="proj-category"></span>
            <h1 class="demo-title" id="proj-title"></h1>
            <div class="demo-meta" id="proj-meta"></div>
            <p class="demo-desc" id="proj-desc"></p>
            <div class="tag-row" id="proj-tags"></div>
            <div class="cta-row" id="proj-cta"></div>
        </div>

        <!-- RIGHT: Unity player -->
        <div class="unity-wrapper" id="unity-wrapper">
            <canvas id="unity-canvas"></canvas>
            <div id="unity-loading-bar">
                <p id="unity-loading-text">Loading...</p>
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
            <button class="fullscreen-btn" id="fullscreen-btn" title="Fullscreen">
                <i class='bx bx-fullscreen'></i>
            </button>
        </div>

    </div>
</main>

<footer class="footer">
    <p>Copyright &copy; <span id="yr"></span> Andrea Bona · All Rights Reserved.</p>
    <a href="#" aria-label="Back to top"><i class='bx bx-up-arrow-alt'></i></a>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const menuIcon = document.getElementById('menu-icon');
const navbar   = document.querySelector('.navbar');
menuIcon.addEventListener('click', () => navbar.classList.toggle('active'));

const isMobileDevice = window.innerWidth <= 768 || /Mobi|Android|iPhone/i.test(navigator.userAgent);

// ── RENDER INFO CON INIBITORE MOBILE ──────────────────────
function renderDemo(p) {
    document.getElementById('page-title').textContent = p.title + ' - Portfolio - Andrea Bona';
    document.getElementById('page-desc').setAttribute('content', p.metaDesc || '');
    document.getElementById('proj-category').textContent = p.category;
    document.getElementById('proj-title').innerHTML = p.titleHTML;
    document.getElementById('proj-desc').textContent = p.shortDesc;

    const metaEl = document.getElementById('proj-meta');
    p.meta.forEach(m => {
        const pill = document.createElement('span');
        pill.className = 'meta-pill';
        pill.innerHTML = `<i class='bx ${m.icon}'></i> ${m.text}`;
        metaEl.appendChild(pill);
    });

    const tagEl = document.getElementById('proj-tags');
    p.tags.forEach(t => {
        const s = document.createElement('span');
        s.className = 'tag'; s.textContent = t;
        tagEl.appendChild(s);
    });

    const ctaEl = document.getElementById('proj-cta');
    p.cta.forEach(c => {
        const a = document.createElement('a');
        
        const isGameAction = c.label.toLowerCase().includes('play') || c.label.toLowerCase().includes('demo');

        if (isMobileDevice && isGameAction) {
            a.className = 'btn-secondary';
            a.innerHTML = `<i class='bx bx-desktop'></i> Gioca da PC`;
            a.style.opacity = '0.5';
            a.style.cursor = 'not-allowed';
            a.style.pointerEvents = 'none';
        } else {
            a.href = c.href;
            if (c.external) a.target = '_blank';
            a.className = c.primary ? 'btn-primary' : 'btn-secondary';
            a.innerHTML = `<i class='bx ${c.icon}'></i> ${c.label}`;
        }
        ctaEl.appendChild(a);
    });
}

// ── UNITY LOADER PROTETTO (Previene boot su Mobile) ────────
function loadUnity(config) {
    const canvas      = document.getElementById('unity-canvas');
    const loadingBar  = document.getElementById('unity-loading-bar');
    const progressBar = document.getElementById('unity-progress-bar-full');
    const loadingText = document.getElementById('unity-loading-text');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    if (isMobileDevice) {
        if (progressBar && progressBar.parentElement) progressBar.parentElement.remove();
        loadingBar.innerHTML = `
            <i class='bx bx-desktop mobile-block-icon'></i>
            <p>WebGL player is only available on Desktop PCs.<br><span style="font-size:1.2rem; opacity:0.6;">Please open this link from a computer to play the demo.</span></p>
        `;
        if (canvas) canvas.remove();
        return; 
    }

    const script = document.createElement('script');
    script.src = config.loaderUrl;
    script.onload = () => {
        createUnityInstance(canvas, {
            dataUrl:          config.dataUrl,
            frameworkUrl:     config.frameworkUrl,
            codeUrl:          config.codeUrl,
            streamingAssetsUrl: config.streamingAssetsUrl || 'StreamingAssets',
            companyName:      config.companyName  || 'Andrea Bona',
            productName:      config.productName  || 'Demo',
            productVersion:   config.productVersion || '1.0',
        }, progress => {
            progressBar.style.width = (progress * 100) + '%';
            loadingText.textContent = 'Loading... ' + Math.round(progress * 100) + '%';
        }).then(instance => {
            loadingBar.style.display = 'none';
            fullscreenBtn.addEventListener('click', () => instance.SetFullscreen(1));
        }).catch(err => {
            loadingText.textContent = 'Failed to load. ' + err;
        });
    };
    document.head.appendChild(script);
}

// ── INIT ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    if (window.DEMO_DATA) {
        renderDemo(window.DEMO_DATA);
        if (window.DEMO_DATA.unity) {
            loadUnity(window.DEMO_DATA.unity);
        }
    } else {
        console.error('DEMO_DATA not found.');
    }
});
</script>

<!-- Script dati specifico con cache buster aggiornato -->
<script src="../data/pandemood-demo.js?v=1.1"></script>

</body>
</html>
